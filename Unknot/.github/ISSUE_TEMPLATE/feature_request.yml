name: Idea, exercise or crew member
description: Suggest an improvement, a new exercise or a new member of the Stretch Crew
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Unknot to do, or who should join the crew next?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?

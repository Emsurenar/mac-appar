name: Build

on:
  push:
    branches: [main]
    # Unknot has its own workflow
    paths-ignore: ["Unknot/**", ".github/workflows/unknot.yml", ".github/workflows/website.yml"]
  pull_request:
    paths-ignore: ["Unknot/**", ".github/workflows/unknot.yml", ".github/workflows/website.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        app: [DynamicIsland, Hallning]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcode-select -p
          swift --version
      - name: Build
        working-directory: ${{ matrix.app }}
        run: swift build -c release --arch arm64

name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Unknot
        - Dynamic Island
        - Posture
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      placeholder: |
        1. Open Settings
        2. Turn on …
        3. …
  - type: input
    id: version
    attributes:
      label: App version
      description: In Unknot, Settings → About. "Report a problem" there fills this in for you.
      placeholder: "1.9.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Air M3"
    validations:
      required: true

name: Dynamic Island release

on:
  push:
    tags: ["island-v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: DynamicIsland

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check the install script
        run: bash -n install.sh

      - name: Set the version from the tag
        if: startsWith(github.ref, 'refs/tags/island-v')
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#island-v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      - name: Build
        run: ./build.sh

      - name: Zip
        run: ditto -c -k --keepParent "build/Dynamic Island.app" build/DynamicIsland.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland
          path: DynamicIsland/build/DynamicIsland.zip

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/island-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/DynamicIsland.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/DynamicIsland.zip --title "Dynamic Island ${GITHUB_REF_NAME#island-v}" --generate-notes
          fi
